<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta
      name="description"
      content="FreshFold collects laundry across Kumasi, washes it properly and brings it back the next day. Wash from ₵30 a load. Pickup and delivery are free."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo carries the marketing page: one family, one axis pair (wdth
      62–125, wght 100–900), so a headline can be wide and heavy and its own
      caption narrow and light without a second download. Cormorant and Outfit
      stay for the portal, the booking modal and the supervisor desk, which
      still reference --font-serif / --font-sans.

      Keep this list in step with --font-display / --font-serif / --font-sans /
      --font-mono in src/index.css.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>FreshFold Laundry Co. — Kumasi laundry, collected and returned</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
